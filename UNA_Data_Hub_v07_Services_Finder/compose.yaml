services:
  db:
    image: postgis/postgis:17-3.7
    platform: linux/amd64
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-una_hub}
      POSTGRES_USER: ${POSTGRES_USER:-una_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
      - ./sql/002_services.sql:/docker-entrypoint-initdb.d/002_services.sql:ro
      - ./sql/003_community.sql:/docker-entrypoint-initdb.d/003_community.sql:ro
      - ./sql/004_accounts.sql:/docker-entrypoint-initdb.d/004_accounts.sql:ro
      - ./sql/006_services_finder.sql:/docker-entrypoint-initdb.d/006_services_finder.sql:ro
      - ./sql/005_transport.sql:/docker-entrypoint-initdb.d/005_transport.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  api:
    build: .
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
      APP_ENV: ${APP_ENV:-production}
      COMMUNITY_JWT_SECRET: ${COMMUNITY_JWT_SECRET:-}
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:-}
      AUTH_LOCAL_ENABLED: ${AUTH_LOCAL_ENABLED:-false}
      AUTH_ALLOW_REGISTRATION: ${AUTH_ALLOW_REGISTRATION:-false}
      AUTH_DEV_EXPOSE_TOKENS: ${AUTH_DEV_EXPOSE_TOKENS:-false}
      TRANSPORT_BRIDGE_TOKEN: ${TRANSPORT_BRIDGE_TOKEN:-}
      TRANSPORT_WEBHOOK_SECRET: ${TRANSPORT_WEBHOOK_SECRET:-}
      OVERPASS_URL: ${OVERPASS_URL:-https://overpass-api.de/api/interpreter}
      OVERPASS_USER_AGENT: ${OVERPASS_USER_AGENT:-UNADataHubResearch/0.2 (contact: configured-by-admin)}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
volumes:
  pgdata:
