name: una-puno-360
services:
  db:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-una_puno_360}
      POSTGRES_USER: ${POSTGRES_USER:-una_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env and set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./services/api/sql/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
      - ./services/api/sql/002_services.sql:/docker-entrypoint-initdb.d/002_services.sql:ro
      - ./services/api/sql/003_community.sql:/docker-entrypoint-initdb.d/003_community.sql:ro
      - ./services/api/sql/004_accounts.sql:/docker-entrypoint-initdb.d/004_accounts.sql:ro
      - ./services/api/sql/005_transport.sql:/docker-entrypoint-initdb.d/005_transport.sql:ro
      - ./services/api/sql/006_services_finder.sql:/docker-entrypoint-initdb.d/006_services_finder.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
  api:
    build: ./services/api
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-una_user}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-una_puno_360}
      APP_ENV: ${APP_ENV:-development}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3000}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      AUTH_LOCAL_ENABLED: ${AUTH_LOCAL_ENABLED:-true}
      AUTH_ALLOW_REGISTRATION: ${AUTH_ALLOW_REGISTRATION:-true}
      AUTH_DEV_EXPOSE_TOKENS: ${AUTH_DEV_EXPOSE_TOKENS:-true}
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET}
      COMMUNITY_JWT_SECRET: ${COMMUNITY_JWT_SECRET}
      TRANSPORT_BRIDGE_TOKEN: ${TRANSPORT_BRIDGE_TOKEN}
      TRANSPORT_WEBHOOK_SECRET: ${TRANSPORT_WEBHOOK_SECRET}
      OVERPASS_USER_AGENT: ${OVERPASS_USER_AGENT:-UNAPuno360-MVP/0.8 (configure-contact)}
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      db: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    depends_on:
      api: { condition: service_healthy }
    restart: unless-stopped
volumes:
  postgres_data:
